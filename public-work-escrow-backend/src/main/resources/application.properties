spring.application.name=public-work-escrow-backend


# Configuración del servidor
server.port=8082

# Límites de carga de archivos (PDFs de pliegos grandes)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuración del Nodo IPFS
ipfs.host=127.0.0.1
ipfs.port=5001
ipfs.gateway=http://localhost:8080/ipfs/


# Configuración del Nodo Ethereum (Hardhat)
ethereum.node.url=http://127.0.0.1:8545

ethereum.private.key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

blockchain.usdt-contract-address=0x5FbDB2315678afecb367f032d93F642f64180aa3


# ========================================
# 1. Configuración de Base de Datos (MySQL)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/public_work_escrow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect